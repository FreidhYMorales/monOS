# ~/.config/mpv/mpv.conf - monOS defaults for mpv.
# Options: `man mpv` or https://mpv.io/manual/stable/

# --- Video output ---
# libplacebo renderer; mpv picks the GPU API (Vulkan/OpenGL) and the Wayland
# or X11 context by itself. auto-safe uses hardware decoding only with
# decoders known to work and falls back to software otherwise.
vo=gpu-next
hwdec=auto-safe

# --- Cache ---
# Smoother seeking in local files and streams (http, yt-dlp).
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=75MiB

# --- Playback ---
# Resume where you stopped; stay on the last frame at the end of a file.
save-position-on-quit
keep-open=yes

# --- Screenshots (s / S) ---
screenshot-directory=~/Pictures/Screenshots
screenshot-format=png
screenshot-template=mpv-%F-%p

# --- On-screen display ---
osd-bar=yes
