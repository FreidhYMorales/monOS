# ~/.config/atuin/config.toml - monOS defaults for atuin (shell history
# search on Ctrl-R, bound in ~/.config/zsh/integrations.zsh).
# Every other option keeps its default; the full list with descriptions:
# https://docs.atuin.sh/configuration/config/
#
# History stays in a local SQLite database (~/.local/share/atuin). Nothing is
# synced: sync only starts after `atuin register` / `atuin login` (then
# auto_sync, sync_address and sync_frequency apply).

## Enter runs the selected command; Tab puts it on the line for editing.
enter_accept = true

## Compact list under the prompt, at most 20 lines high.
style = "compact"
inline_height = 20

## Do not contact api.atuin.sh to check for new versions (pacman updates atuin).
update_check = false

## Sync (disabled until you log in). Uncomment to change the server/interval.
# auto_sync = true
# sync_address = "https://api.atuin.sh"
# sync_frequency = "10m"
