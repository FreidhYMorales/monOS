# monOS minimal Starship prompt
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = "monos"

format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[palettes.monos]
blue = "#3D8BFF"
bright_blue = "#6AA6FF"
violet = "#9B6BFF"
bright_violet = "#B894FF"
cyan = "#22C3E6"
