# Generated by branding/tools/gen-themes.py — do not edit
# Source: branding/palette/monos.toml
# monOS Starship prompt (one line):
#   left:  distro glyph, directory, git branch/commit/state/status, prompt character
#   right: language/tool of the current project (label + icon), memory (only
#          above 75 %), duration of slow commands, exit status of failed
#          commands, time
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
palette = "monos"
continuation_prompt = "[▶▶ ](muted)"

format = "[\U000f08c7 ](bold blue)$directory$git_branch$git_commit$git_state$git_status$character"
right_format = "$c$cpp$cmake$golang$rust$python$nodejs$java$kotlin$lua$php$ruby$dotnet$docker_context$nix_shell$aws$memory_usage$cmd_duration$status$time"

[palettes.monos]
blue = "#3D8BFF"
bright_blue = "#6AA6FF"
violet = "#9B6BFF"
bright_violet = "#B894FF"
cyan = "#22C3E6"
bright_cyan = "#5CD8F0"
green = "#3FD68A"
bright_green = "#6BE6A6"
yellow = "#F5C451"
bright_yellow = "#FFD978"
red = "#F2555A"
bright_red = "#FF7A7E"
muted = "#7D8699"
fg_dim = "#A9B1C1"
fg = "#E6E9EF"

[directory]
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = "\ue0a0 "
style = "bold violet"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_commit]
style = "bold green"
format = "[\\($hash$tag\\)]($style) "

[git_state]
style = "bold yellow"

[git_status]
style = "bold cyan"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
format = "([$all_status$ahead_behind]($style) )"

[character]
success_symbol = "[❯](bold bright_blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[c]
symbol = " "
style = "bold bright_cyan"
format = " [c](italic muted) [$symbol]($style)"

[cpp]
symbol = " "
style = "bold bright_cyan"
format = " [cpp](italic muted) [$symbol]($style)"

[cmake]
symbol = " "
style = "bold bright_blue"
format = " [cmake](italic muted) [$symbol]($style)"

[golang]
symbol = " "
style = "bold bright_cyan"
format = " [go](italic muted) [$symbol]($style)"

[rust]
symbol = "󱘗 "
style = "bold bright_red"
format = " [rs](italic muted) [$symbol]($style)"

[python]
symbol = " "
style = "bold bright_yellow"
format = " [py](italic muted) [${symbol}(\\($virtualenv\\) )${version}]($style)"
version_format = "${raw}"

[nodejs]
symbol = " "
style = "bold bright_green"
format = " [node](italic muted) [$symbol]($style)"
detect_extensions = []
detect_files = ["package.json", "package-lock.json", "yarn.lock", "pnpm-lock.yaml", ".nvmrc"]
detect_folders = ["node_modules"]

[java]
symbol = " "
style = "bold bright_red"
format = " [java](italic muted) [$symbol]($style)"

[kotlin]
symbol = " "
style = "bold bright_violet"
format = " [kt](italic muted) [$symbol]($style)"

[lua]
symbol = " "
style = "bold bright_blue"
format = " [lua](italic muted) [$symbol]($style)"

[php]
symbol = " "
style = "bold violet"
format = " [php](italic muted) [$symbol]($style)"

[ruby]
symbol = " "
style = "bold red"
format = " [rb](italic muted) [$symbol]($style)"

[dotnet]
symbol = " "
style = "bold violet"
format = " [.net](italic muted) [$symbol]($style)"

[docker_context]
symbol = " "
style = "bold blue"
format = " [docker](italic muted) [$symbol$context]($style)"

[nix_shell]
symbol = " "
style = "bold bright_blue"
format = " [nix](italic muted) [$symbol$state( $name)]($style)"

[aws]
symbol = " "
style = "bold yellow"
format = " [aws](italic muted) [$symbol$profile( $region)]($style)"
disabled = true

[memory_usage]
disabled = false
threshold = 75
symbol = "\U000f035b "
style = "bold bright_cyan"
format = " [mem](italic muted) [$symbol$ram( | $swap)]($style)"

[cmd_duration]
min_time = 2000
style = "bold yellow"
format = " [\uf252 $duration]($style)"

[status]
disabled = false
symbol = "\uf00d "
style = "bold red"
format = " [$symbol$status]($style)"

[time]
disabled = false
time_format = "%R"
style = "fg_dim"
format = " [\uf43a $time]($style)"
