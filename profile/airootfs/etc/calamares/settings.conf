# monOS Calamares configuration (Calamares 3.4.x).
#
# Package defaults live in /usr/share/calamares (owned by the calamares
# package); everything under /etc/calamares is monOS-specific and takes
# precedence. Module configurations are in /etc/calamares/modules.
#
# The launcher (/usr/local/bin/monos-install) hides the "netinstall" page when
# there is no internet connection by bind-mounting a filtered copy of this
# file (the line "  - netinstall" is removed). Keep that line exactly as is.
---
modules-search: [ local ]

instances:
    # "Install yay?" page. Its answer is stored in GlobalStorage as
    # packagechooser_yay ("yay" or "none").
    - id: yay
      module: packagechooser
      config: packagechooser_yay.conf
    # Removes yay-bin from the target when the user declined it.
    - id: yay
      module: contextualprocess
      config: contextualprocess_yay.conf
    # "AI tools" page (optional, multiple choice). Its answer is stored in
    # GlobalStorage as packagechooser_ai, a comma-separated list of item ids.
    - id: ai
      module: packagechooser
      config: packagechooser_ai.conf
    # Removes the AI tools the user did not select.
    - id: ai
      module: shellprocess
      config: shellprocess_ai.conf
    # Strips live-session leftovers from the target, restores kernels and
    # mkinitcpio presets, and initializes the pacman keyring.
    - id: cleanup
      module: shellprocess
      config: shellprocess_cleanup.conf
    # Removes drivers and VM guest tools the machine does not need.
    - id: hardware
      module: shellprocess
      config: shellprocess_hardware.conf
    # btrfs only: snapper root config, snapshot timers and grub-btrfsd.
    - id: snapper
      module: shellprocess
      config: shellprocess_snapper.conf

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - packagechooser@yay
        - packagechooser@ai
        - netinstall
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - luksbootkeyfile
        - shellprocess@cleanup
        - shellprocess@hardware
        - initcpiocfg
        - removeuser
        - users
        - displaymanager
        - networkcfg
        - hwclock
        - services-systemd
        - contextualprocess@yay
        - shellprocess@ai
        - packages
        - shellprocess@snapper
        - initcpio
        - grubcfg
        - bootloader
        - umount
    - show:
        - finished

branding: monos

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
