# monOS: welcome page and installation requirements.
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    requiredStorage:    20
    requiredRam:        2.0
    # The result is stored in GlobalStorage as "hasInternet"; the packages
    # module only refreshes pacman databases when it is true.
    internetCheckUrl:   https://archlinux.org
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    required:
        - storage
        - ram
        - root

geoip:
    style:    "json"
    url:      "https://geoip.kde.org/v1/calamares"
    selector: ""
