# monOS: remove the drivers and VM guest tools this machine does not need
# (NVIDIA, thermald, intel-media-driver, guest tools). Runs on the live system
# (dontChroot) with the target root as argument; detection uses the live
# system's /sys and /proc, removal runs pacman in the target. Runs before the
# packages module, snapper and initcpio. See the script for details.
---
dontChroot: true
timeout: 600
verbose: true
script:
    - "/etc/calamares/scripts/monos-hardware-cleanup.sh ${ROOT}"
