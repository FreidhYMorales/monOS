# monOS: /etc/default/grub on the target.
# GRUB_DISTRIBUTOR comes from branding (bootloaderEntryName: monOS).
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet", "loglevel=3" ]
defaults:
    GRUB_TIMEOUT: 5
    # Not "saved": GRUB cannot write grubenv on btrfs (or LUKS).
    GRUB_DEFAULT: "0"
    # Boot the regular kernel by default; linux-lts is the fallback in the
    # submenu (grub-mkconfig otherwise picks whichever sorts first).
    GRUB_TOP_LEVEL: "/boot/vmlinuz-linux"
    GRUB_DISABLE_SUBMENU: false
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true
    GRUB_DISABLE_OS_PROBER: false
always_use_defaults: true
