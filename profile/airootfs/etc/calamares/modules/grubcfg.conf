# monOS: /etc/default/grub on the target.
# GRUB_DISTRIBUTOR comes from branding (bootloaderEntryName: monOS).
# "splash" is added to the kernel command line automatically because plymouth
# is installed on the target (grubcfg checks `which plymouth`).
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet", "loglevel=3" ]
defaults:
    GRUB_TIMEOUT: 5
    # Not "saved": GRUB cannot write grubenv on btrfs (or LUKS).
    GRUB_DEFAULT: "0"
    # Boot the regular kernel by default; linux-lts is the fallback in the
    # submenu (grub-mkconfig otherwise picks whichever sorts first).
    GRUB_TOP_LEVEL: "/boot/vmlinuz-linux"
    GRUB_DISABLE_SUBMENU: false
    # The graphical theme needs gfxterm. monos-target-cleanup.sh (which runs
    # before grubcfg) copies the theme from /usr/share/grub/themes/monos to
    # /boot/grub/themes/monos as non-sparse files: GRUB's btrfs driver cannot
    # read files that end in a hole, as copies from the squashfs may.
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_GFXMODE: "auto"
    GRUB_GFXPAYLOAD_LINUX: "keep"
    GRUB_THEME: "/boot/grub/themes/monos/theme.txt"
    GRUB_DISABLE_RECOVERY: true
    GRUB_DISABLE_OS_PROBER: false
always_use_defaults: true
