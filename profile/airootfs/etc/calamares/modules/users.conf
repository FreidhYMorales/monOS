# monOS: user account, root password and hostname.
#
# sudo: members of "wheel" may use sudo (with password). The module writes
# /etc/sudoers.d/10-installer with "%wheel ALL=(ALL:ALL) ALL".
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - name: docker
      must_exist: false
      system: true

sudoersGroup: wheel
sudoersConfigureWithGroup: false

autologinGroup: autologin
displayAutologin: true
doAutologin: false

setRootPassword: true
doReusePassword: true

passwordRequirements:
    minLength: 1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
    shell: /usr/bin/zsh
    forbidden_names: [ root, liveuser ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "monos-${cpu}"
