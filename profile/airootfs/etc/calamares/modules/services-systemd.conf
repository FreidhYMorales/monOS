# monOS: services enabled on the installed system.
#
# Live-only units (choose-mirror, pacman-init, livecd-*, the gnupg tmpfs
# mount) are deleted from the target, together with their enablement
# symlinks, by scripts/monos-target-cleanup.sh.
# Snapper timers and grub-btrfsd are enabled by scripts/monos-snapper-setup.sh,
# only when the root filesystem is btrfs.
# thermald and the VM guest tools are enabled on the live system; on the
# installed system scripts/monos-hardware-cleanup.sh disables and removes them
# when the hardware does not need them. fwupd is D-Bus activated (Discover
# refreshes the firmware metadata), so it needs no unit here.
# ufw.service only applies the rules because /etc/ufw/ufw.conf has
# ENABLED=yes (set at ISO build time by a pacman hook).
---
units:
    - name: "NetworkManager.service"
      action: "enable"
      mandatory: true
    - name: "sddm.service"
      action: "enable"
      mandatory: true
    - name: "bluetooth.service"
      action: "enable"
    - name: "docker.socket"
      action: "enable"
    - name: "systemd-oomd.service"
      action: "enable"
    - name: "power-profiles-daemon.service"
      action: "enable"
    - name: "fstrim.timer"
      action: "enable"
    - name: "paccache.timer"
      action: "enable"
    - name: "systemd-timesyncd.service"
      action: "enable"
    - name: "systemd-resolved.service"
      action: "enable"
    - name: "cups.socket"
      action: "enable"
    - name: "ufw.service"
      action: "enable"
