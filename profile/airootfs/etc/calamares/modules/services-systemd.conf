# monOS: services enabled on the installed system.
#
# Live-only units (choose-mirror, pacman-init, livecd-*, the gnupg tmpfs
# mount) are deleted from the target, together with their enablement
# symlinks, by scripts/monos-target-cleanup.sh.
# Snapper timers and grub-btrfsd are enabled by scripts/monos-snapper-setup.sh,
# only when the root filesystem is btrfs.
# thermald and the VM guest tools are enabled on the live system; on the
# installed system scripts/monos-hardware-cleanup.sh disables and removes them
# when the hardware does not need them. fwupd is D-Bus activated (Discover
# refreshes the firmware metadata), so it needs no unit here.
# ufw.service only applies the rules because /etc/ufw/ufw.conf has
# ENABLED=yes (set at ISO build time by a pacman hook).
# NetworkManager-wait-online.service is disabled: nothing monOS starts at boot
# needs network-online.target, and enabling NetworkManager.service enables it
# again (Also= in its [Install] section), hence the explicit disable right
# after it. Units are processed in the order listed.
# reflector.timer refreshes /etc/pacman.d/mirrorlist weekly (options in
# /etc/xdg/reflector/reflector.conf, set at ISO build time by a pacman hook);
# it is not enabled on the live system.
---
units:
    - name: "NetworkManager.service"
      action: "enable"
      mandatory: true
    - name: "NetworkManager-wait-online.service"
      action: "disable"
    - name: "sddm.service"
      action: "enable"
      mandatory: true
    - name: "bluetooth.service"
      action: "enable"
    - name: "docker.socket"
      action: "enable"
    - name: "systemd-oomd.service"
      action: "enable"
    - name: "power-profiles-daemon.service"
      action: "enable"
    - name: "fstrim.timer"
      action: "enable"
    - name: "paccache.timer"
      action: "enable"
    - name: "reflector.timer"
      action: "enable"
    - name: "systemd-timesyncd.service"
      action: "enable"
    - name: "systemd-resolved.service"
      action: "enable"
    - name: "cups.socket"
      action: "enable"
    - name: "ufw.service"
      action: "enable"
    # Live-only: on an installed desktop these cost more than they give.
    # ModemManager probes serial ports at boot and can grab Arduino/ESP boards
    # (only needed for mobile-broadband modems; `systemctl enable --now` it if
    # you have one). Disabling also drops its D-Bus alias, so NetworkManager
    # cannot activate it either.
    - name: "ModemManager.service"
      action: "disable"
    # Holds every calendar timer (snapper, fstrim, paccache, reflector) until
    # NTP syncs, which never happens offline. Only pacman-init on the live ISO
    # needs it.
    - name: "systemd-time-wait-sync.service"
      action: "disable"
