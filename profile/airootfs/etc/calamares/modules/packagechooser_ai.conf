# monOS: optional AI tools (zero or more).
#
# Every tool below is already on the live system (and therefore copied to the
# target). The selected item ids are written to GlobalStorage as
# "packagechooser_ai" (comma-separated, empty when nothing is selected) and
# handled by shellprocess@ai (scripts/monos-ai-tools.sh), which removes the
# packages of every tool that was not selected.
---
mode: optionalmultiple
method: legacy
labels:
    step: "AI tools"
items:
    - id: claude
      name: "Claude Code"
      description: "Anthropic's agentic coding tool for the terminal (requires a Claude account or API key)."
      screenshot: "logo.png"
    - id: antigravity
      name: "Google Antigravity"
      description: "Google's agent-first IDE (requires a Google account)."
      screenshot: "logo.png"
    - id: herdr
      name: "herdr"
      description: "Terminal workspace manager that runs and supervises several coding agents (Claude Code, Codex, OpenCode...) side by side."
      screenshot: "logo.png"
    - id: ollama
      name: "Ollama"
      description: "Run open large language models locally, offline (CPU; models are downloaded on demand)."
      screenshot: "logo.png"
    - id: zed
      name: "Zed"
      description: "Fast native code editor with built-in AI assistance and agent integration."
      screenshot: "logo.png"
