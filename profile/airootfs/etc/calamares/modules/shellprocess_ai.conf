# monOS: remove the AI tools not selected on the "AI tools" page
# (packagechooser@ai). Runs on the live system (dontChroot) because
# shellprocess@cleanup already deleted /etc/calamares from the target; pacman
# runs in the target. The "sel:" prefix keeps the argument non-empty when
# nothing was selected.
---
dontChroot: true
timeout: 600
verbose: true
script:
    - "/etc/calamares/scripts/monos-ai-tools.sh ${ROOT} sel:${gs[packagechooser_ai]}"
