# monOS: mount the target filesystems.
#
# btrfs layout (flat, snapper/grub-btrfs friendly):
#   @           -> /
#   @home       -> /home
#   @log        -> /var/log               (kept out of root snapshots)
#   @pkg        -> /var/cache/pacman/pkg  (kept out of root snapshots)
#   @snapshots  -> /.snapshots            (snapper root config)
#   @swap       -> /swap                  (only if a swap file is chosen)
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache/pacman/pkg
      subvolume: /@pkg
    - mountPoint: /.snapshots
      subvolume: /@snapshots

btrfsSwapSubvol: /@swap

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
    - filesystem: ext4
      options: [ defaults, noatime ]
