# monOS: package operations on the target (pacman, inside the chroot).
#
# The live system is copied as is, so the installer and archiso-only packages
# are removed here, together with rescue/legacy tools that only make sense on
# the live medium. Hardware-dependent removals (NVIDIA, thermald,
# intel-media-driver, VM guest tools) are done by shellprocess@hardware.
# pacman -Rs removes each package with its dependencies that nothing else
# needs; explicitly installed packages are never removed as dependencies, and
# a package something else requires is kept (try_remove only warns). Netinstall selections are added to the operations by the
# netinstall module. Pacman databases are only refreshed when the welcome
# page detected internet access.
---
backend: pacman
skip_if_no_internet: false
update_db: true
ignore_update_db_error: true
update_system: false
pacman:
    num_retries: 2
    disable_download_timeout: false
    needed_only: true
operations:
    - try_remove:
        - calamares
        - ckbcomp
        - mkinitcpio-archiso
        - archinstall
        - livecd-sounds
        # Disk imaging/rescue: clonezilla (with drbl), partclone, partimage
        # (unmaintained), fsarchiver. ddrescue/testdisk stay.
        - clonezilla
        - partclone
        - partimage
        - fsarchiver
        # Live-medium helpers: IRC client and text browser for the install
        # guide, PXE HTTP server. (mkinitcpio-nfs-utils, the PXE/NFS initramfs
        # hook, stays: 100 KiB, and removing it would rebuild every initramfs
        # once more.)
        - irssi
        - lynx
        - darkhttpd
        # Duplicates yazi.
        - mc
        # Legacy dial-up and VPN clients (L2TP, PPTP). openconnect and vpnc
        # stay (openconnect needs vpnc's vpnc-script).
        - xl2tpd
        - pptpclient
        - wvdial
        # Live speech/braille boot. brltty also claims CH340/CH341 USB-serial
        # adapters (Arduino clones, ESP boards), a common developer annoyance.
        - espeakup
        - brltty
        # Boot-medium tools. memtest86+ installs into /boot, which the live
        # root filesystem does not keep (broken on the installed system);
        # the UEFI shell, rEFInd and Syslinux only boot the ISO (the installed
        # system uses GRUB).
        - memtest86+
        - memtest86+-efi
        - edk2-shell
        - refind
        - syslinux
