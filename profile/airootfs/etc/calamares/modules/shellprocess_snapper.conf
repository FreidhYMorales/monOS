# monOS: snapper root config, snapshot timers and grub-btrfsd (btrfs only;
# the script exits successfully without changes on other filesystems).
# Runs after the packages module so package removals are not snapshotted.
---
dontChroot: true
timeout: 300
verbose: true
script:
    - "/etc/calamares/scripts/monos-snapper-setup.sh ${ROOT}"
