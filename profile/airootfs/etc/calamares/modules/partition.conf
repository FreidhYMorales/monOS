# monOS: disk partitioning.
#
# - btrfs is the default (snapshots with snapper + grub-btrfs); ext4 is offered too.
# - The EFI system partition is mounted at /boot/efi, so /boot (kernels and
#   initramfs) stays inside the btrfs root subvolume and is part of every
#   snapshot. That keeps kernel and modules consistent after a rollback.
# - LUKS encryption is available in the automated modes. /boot is encrypted
#   together with / and GRUB unlocks it, which is why LUKS1 is used (GRUB does
#   not support LUKS2 with Argon2).
# - No swap partition: monOS uses zram (zram-generator). A swap file can be
#   chosen instead.
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        300MiB
    label:              "EFI"

userSwapChoices:
    - none
    - file
initialSwapChoice: none

luksGeneration: luks1
enableLuksAutomatedPartitioning: true
preCheckEncryption: false

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
showNotEncryptedBootMessage: true
initialPartitioningChoice: none

defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]

essentialMounts: [ "live-*", "control", "ventoy" ]

lvm:
    enable: true
