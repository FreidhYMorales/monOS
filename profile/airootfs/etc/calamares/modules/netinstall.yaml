# monOS optional software groups.
# Groups are downloaded during the installation, so they do not take space on
# the ISO. Every group is non-critical: Calamares installs its packages one by
# one, and a package that fails (e.g. the [monos] repository is unreachable)
# is logged and skipped instead of aborting the installation. Only "AI" is
# selected by default.
#
# Groups marked "monOS repository" use AUR packages prebuilt by aur/build.sh
# and published to GitHub Releases by aur/publish.sh ([monos] in
# /etc/pacman.conf). Not available at all (install later with yay):
#   - mongodb, pgadmin4 (AUR)
#   - redis (replaced in the official repositories by valkey, a drop-in fork)
- name: "AI"
  description: "AI coding agents (OpenCode, Gemini CLI, Codex), local models (Ollama) and the Zed editor"
  selected: true
  critical: false
  packages:
    - opencode
    - gemini-cli
    - openai-codex
    - ollama
    - zed

- name: "AI from the AUR"
  description: "Claude Code, Google Antigravity and herdr (monOS repository; Claude/Google account required)"
  selected: false
  critical: false
  packages:
    - claude-code
    - antigravity-ide
    - herdr-bin

