# monOS: HOOKS for /etc/mkinitcpio.conf on the target.
#
# Busybox-based hooks (base udev ... encrypt) are used on purpose: the
# grub-btrfs-overlayfs hook only works with them. It lets a read-only btrfs
# snapshot booted from the GRUB "snapshots" submenu start with a writable
# overlay in RAM. On non-btrfs roots the hook does nothing.
---
useSystemdHook: false
hooks:
    prepend: []
    append: [ grub-btrfs-overlayfs ]
    remove: []
source: "/etc/mkinitcpio.conf"
