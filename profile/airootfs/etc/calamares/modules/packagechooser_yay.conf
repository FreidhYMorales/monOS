# monOS: optional AUR helper.
#
# yay-bin is already on the live system (and therefore copied to the target).
# The answer is written to GlobalStorage as "packagechooser_yay" and handled
# by contextualprocess@yay, which removes yay-bin when the answer is "none".
---
mode: required
method: legacy
labels:
    step: "AUR helper"
default: yay
items:
    - id: yay
      name: "Install yay (AUR helper)"
      description: "Keep yay, a pacman wrapper and helper for the Arch User Repository (AUR). Recommended: most developer tools that are not in the official repositories are in the AUR."
      screenshot: "logo.png"
    - id: none
      name: "Do not install yay"
      description: "Use only the official Arch Linux repositories. You can install an AUR helper later."
      screenshot: "logo.png"
