# monOS: copy the live root filesystem to the target.
#
# mkarchiso stores it at <install_dir>/<arch>/airootfs.sfs on the ISO, and the
# archiso initramfs mounts the boot medium at /run/archiso/bootmnt.
# (Booting the live system with "copytoram" unmounts the medium and is not
# supported for installation.)
---
unpack:
    - source: "/run/archiso/bootmnt/monos/x86_64/airootfs.sfs"
      sourcefs: "squashfs"
      destination: ""
