# monOS live session: nouveau is only loaded for NVIDIA GPUs that the NVIDIA
# open kernel modules cannot drive (pre-Turing), see
# /usr/local/lib/monos/nouveau-gate. It works together with
# /etc/modprobe.d/nvidia-utils.conf, which is written at ISO build time
# (pacman hook 41-monos-nvidia-live.hook) as a copy of nvidia-utils' file
# without its "blacklist nouveau" line.
#
# Inside the initramfs the gate script does not exist, so nouveau is not
# loaded there (as with the stock blacklist); udev loads it after switching
# to the real root when the gate allows it.
#
# Live only: the installer deletes this file.
install nouveau if [ -x /usr/local/lib/monos/nouveau-gate ]; then exec /usr/local/lib/monos/nouveau-gate; fi
