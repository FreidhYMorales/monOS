# monOS live session: log the live user straight into Plasma (Wayland).
# "plasma" matches /usr/share/wayland-sessions/plasma.desktop (Plasma 6).
# The greeter itself (only shown after logout) uses SDDM's default X11
# display server, which is the most robust option in VMs.
# The installer (later phase) must remove or rewrite this file on the target.
[Autologin]
User=liveuser
Session=plasma
Relogin=false

[Theme]
Current=breeze
