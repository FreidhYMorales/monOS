# monOS kitty configuration - "deep space" palette

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

window_padding_width 8
background_opacity   0.95
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam

# --- Colors ---
foreground            #d8dcf0
background            #0b0e1a
selection_foreground  #0b0e1a
selection_background  #8b5cf6
cursor                #c4b5fd
cursor_text_color     #0b0e1a
url_color             #22d3ee

active_tab_foreground   #0b0e1a
active_tab_background   #8b5cf6
inactive_tab_foreground #94a3b8
inactive_tab_background #141a2e

