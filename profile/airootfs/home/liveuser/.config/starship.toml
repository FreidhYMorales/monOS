# monOS minimal Starship prompt
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[directory]
style = "bold #8b5cf6"
truncation_length = 3

[git_branch]
symbol = " "
style = "bold #22d3ee"

[git_status]
style = "bold #f472b6"

[cmd_duration]
min_time = 2000
style = "#94a3b8"

[character]
success_symbol = "[❯](bold #a78bfa)"
error_symbol = "[❯](bold #f87171)"
