LABEL monos
TEXT HELP
Boot the monOS live medium on BIOS.
It allows you to install monOS or perform system maintenance.
ENDTEXT
MENU LABEL monOS live medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash

# Safe graphics boot option (disables kernel mode setting)
LABEL monosnomodeset
TEXT HELP
Boot the monOS live medium on BIOS with kernel mode setting disabled.
Use this if the graphical session fails to start (GPU/driver issues).
ENDTEXT
MENU LABEL monOS live medium (%ARCH%, BIOS, safe graphics, nomodeset)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset

# Accessibility boot option
LABEL monosspeech
TEXT HELP
Boot the monOS live medium on BIOS with speakup screen reader.
It allows you to install monOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL monOS live medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
