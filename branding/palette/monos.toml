# monOS brand palette: the single source of truth for every theme.
#
# branding/tools/gen-themes.py renders all terminal, editor, KDE, GRUB and
# installer colors from this file. Edit colors here, then run:
#
#   python3 branding/tools/gen-themes.py
#   ./branding/tools/install-branding.sh   # images that embed colors
#
# Contrast targets (WCAG 2.x, measured on ui.bg): fg >= 7:1, fg-dim and
# muted >= 4.5:1, every ANSI text color >= 4.5:1 (ansi.black excepted: it is
# a background shade). gen-themes.py --check prints the ratios.

[meta]
name = "monOS"
variant = "dark"

# Fixed brand colors (logo and artwork). Not all of them are text colors:
# blue on bg is only 4.2:1, use ui.accent-text for text/links on dark.
[brand]
background = "#0B0D12"
blue = "#0C6BFA"
violet = "#7C3AED"
shadow = "#4C4D4F"
white = "#FCFCFC"

# Dark UI scale, darkest to lightest surface, then text.
[ui]
bg = "#0B0D12"          # window/terminal background (brand background)
surface = "#12151C"     # views, editor gutter, inactive panes
surface2 = "#1A1E27"    # windows, cursor line, status bars
overlay = "#232833"     # buttons, popups, menus
border = "#2E3440"      # separators and inactive borders
fg = "#E6E9EF"          # main text
fg-dim = "#A9B1C1"      # secondary text
muted = "#7D8699"       # comments, placeholders, disabled text
selection = "#1F3B6E"   # text selection background (fg stays readable)
accent = "#0C6BFA"      # brand blue: highlights, active borders, buttons
accent-fg = "#FCFCFC"   # text on accent (4.55:1)
accent-text = "#3D8BFF" # brand blue usable as text on bg
violet = "#7C3AED"      # secondary brand color (backgrounds, gradients)
violet-text = "#9B6BFF" # violet usable as text on bg
cursor = "#6AA6FF"

# 16-color terminal palette. Order: normal, bright.
[ansi]
black = "#1A1E27"
red = "#F2555A"
green = "#3FD68A"
yellow = "#F5C451"
blue = "#3D8BFF"
magenta = "#9B6BFF"
cyan = "#22C3E6"
white = "#C8CEDA"
bright-black = "#737D90"
bright-red = "#FF7A7E"
bright-green = "#6BE6A6"
bright-yellow = "#FFD978"
bright-blue = "#6AA6FF"
bright-magenta = "#B894FF"
bright-cyan = "#5CD8F0"
bright-white = "#F5F7FA"

# ---------------------------------------------------------------------------
# monOS Light: light UI scale and terminal palette. Same keys as [ui]/[ansi];
# the scale goes from the lightest surface (bg) towards the text color.
# Used by the Obsidian theme (.theme-light) and reused by the light desktop
# variant. Contrast targets are measured on light.ui.bg like the dark ones,
# except that ansi.white and ansi.bright-white are background shades here
# (ansi.black is a text color in a light terminal).
[light.ui]
bg = "#FCFCFC"          # brand white
surface = "#F3F5F8"
surface2 = "#EAEDF2"
overlay = "#E1E5EC"     # buttons, popups, menus
border = "#CDD3DD"
fg = "#1A1E27"
fg-dim = "#454D5C"
muted = "#5E6778"
selection = "#C9DCFC"
accent = "#0C6BFA"      # brand blue (4.55:1 on bg, also text-safe here)
accent-fg = "#FCFCFC"
accent-text = "#0A5AD6"
violet = "#7C3AED"
violet-text = "#6D28D9"
cursor = "#0C6BFA"

[light.ansi]
black = "#1A1E27"
red = "#C4232A"
green = "#18794A"
yellow = "#8A5A00"
blue = "#0A5AD6"
magenta = "#7C3AED"
cyan = "#0B6F87"
white = "#CDD3DD"
bright-black = "#5E6778"
bright-red = "#D63A40"
bright-green = "#16834F"
bright-yellow = "#9A6700"
bright-blue = "#2F6FE0"
bright-magenta = "#8B4CF0"
bright-cyan = "#08788F"
bright-white = "#E1E5EC"
